<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1a1a19">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<title>Mapa del sistema de agentes</title>
<style>
:root{--sup:#1a1a19;--sup2:#242422;--sup3:#30302d;--tinta:#ecece8;--tinta2:#b4b4ad;--tinta3:#85857f;--linea:#44443f;
  --ok:#0ca30c;--mal:#d03b3b;--medio:#fab219;--nada:#8f939c;--foco:#6fb1ff}
@media (prefers-color-scheme:light){:root{--sup:#fcfcfb;--sup2:#f1f0ec;--sup3:#e4e3de;--tinta:#1c1c1a;--tinta2:#55554f;--tinta3:#7b7b74;--linea:#c9c8c2;--nada:#7d818a;--foco:#1c6fd6}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--sup);color:var(--tinta);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#lienzo{position:fixed;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
header{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:linear-gradient(var(--sup) 70%,transparent);pointer-events:none;z-index:3}
header>*{pointer-events:auto}
h1{font-size:15px;margin:0 6px 0 2px;font-weight:650}
.pastilla,.btn{border:1px solid var(--linea);background:var(--sup2);color:var(--tinta);border-radius:999px;padding:5px 10px;font:inherit;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn{cursor:pointer}.btn[aria-pressed=true]{background:var(--tinta);color:var(--sup);border-color:var(--tinta)}
.pastilla.aviso{border-color:var(--medio)}
.ico{width:14px;height:14px;flex:none}
#barra{position:fixed;left:0;right:0;bottom:0;padding:6px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;z-index:3;
  background:linear-gradient(transparent,var(--sup) 35%)}
#buscar{flex:1 0 110px;min-width:110px;border:1px solid var(--linea);background:var(--sup2);color:var(--tinta);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px}
.hoja{position:fixed;z-index:5;background:var(--sup2);border:1px solid var(--linea);overflow:auto;display:none;box-shadow:0 8px 30px #0006}
.hoja.abierta{display:block}
#ficha,#lista,#sobre{left:0;right:0;bottom:0;max-height:62vh;border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:860px){#ficha,#lista,#sobre{left:auto;top:64px;bottom:64px;right:12px;width:400px;max-height:none;border-radius:14px}}
.cerrar{position:sticky;top:0;float:right;border:0;background:var(--sup3);color:var(--tinta);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
h2{font-size:18px;margin:2px 44px 6px 0}h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3);margin:16px 0 6px}
p{margin:6px 0}.suave{color:var(--tinta2)}.chico{font-size:13px}
.estado{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:13px;border-radius:999px;padding:3px 10px;border:1.5px solid}
.e-funciona{border-color:var(--ok)}.e-reparar{border-color:var(--mal)}.e-mejorar{border-color:var(--medio)}
.e-nodemostrado,.e-estructura,.e-decision,.e-resuelto,.e-hecho{border-color:var(--nada);border-style:dashed}
.tarjeta{border:1px solid var(--linea);border-left-width:4px;border-radius:10px;padding:9px 11px;margin:8px 0;background:var(--sup)}
.tarjeta.e-funciona{border-left-color:var(--ok)}.tarjeta.e-reparar{border-left-color:var(--mal)}.tarjeta.e-mejorar{border-left-color:var(--medio)}
.tarjeta.e-nodemostrado,.tarjeta.e-decision,.tarjeta.e-resuelto{border-left-color:var(--nada);border-style:solid;border-left-style:dashed}
.etq{font-size:11px;font-weight:700;letter-spacing:.04em;border:1px solid var(--linea);border-radius:4px;padding:1px 5px;color:var(--tinta2)}
.ev{border-top:1px dashed var(--linea);margin-top:7px;padding-top:6px;font-size:13px}
.fila{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--linea);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left}
.fila:hover{background:var(--sup3)}
code{font-size:12px;background:var(--sup3);padding:1px 5px;border-radius:4px;word-break:break-all}
#carga{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:9;background:var(--sup)}
#carga input{width:min(92vw,420px);padding:10px;border-radius:8px;border:1px solid var(--linea);background:var(--sup2);color:var(--tinta);font:inherit}
svg text{font:600 11px system-ui,sans-serif;fill:var(--tinta);paint-order:stroke;stroke:var(--sup);stroke-width:3px;stroke-linejoin:round}
svg text.plano{font-size:11px;letter-spacing:.14em;fill:var(--tinta3);font-weight:700}
svg text.sector{font-size:12px;fill:var(--tinta2);cursor:pointer}
.ne{vector-effect:non-scaling-stroke}
</style>
</head>
<body>
<div id="carga"><div><p id="cargaTexto">Cargando el mapa…</p><form id="claveForm" hidden><p class="suave chico">Este mapa está cifrado. Pega aquí la clave del enlace.</p><input id="claveCampo" autocomplete="off" placeholder="clave"><p><button class="btn">Abrir</button></p></form></div></div>
<header>
  <h1>Mapa del sistema</h1>
  <span class="pastilla" id="edad" title="Antigüedad de los datos"></span>
  <span id="chips" style="display:contents"></span>
  <button class="btn" id="quitar" hidden style="border-color:var(--foco)"></button>
</header>
<svg id="lienzo" role="img" aria-label="Mapa tridimensional del sistema de agentes"><g id="gPlanos"></g><g id="gAristas"></g><g id="gNodos"></g><g id="gRotulos"></g></svg>
<nav id="barra">
  <input id="buscar" type="search" placeholder="Buscar…" aria-label="Buscar en el mapa">
  <button class="btn" id="bChat">Preguntar</button>
  <button class="btn" id="bRep">Reparaciones</button>
  <button class="btn" id="bLista">Lista</button>
  <button class="btn" data-vista="3d" aria-pressed="true">3D</button>
  <button class="btn" data-vista="planta">Planta</button>
  <button class="btn" data-vista="perfil">Perfil</button>
  <button class="btn" id="bFiltros">Filtros</button>
  <button class="btn" id="bSinProbar" aria-pressed="false">Sin probar</button>
  <button class="btn" data-plano="proposiciones" aria-pressed="false">Proposiciones</button>
  <button class="btn" data-plano="hechos" aria-pressed="false">Hechos</button>
  <button class="btn" id="bNombres" aria-pressed="false">Nombres</button>
  <button class="btn" id="bSobre">Sobre este mapa</button>
</nav>
<aside class="hoja" id="ficha" aria-live="polite"></aside>
<aside class="hoja" id="lista"></aside>
<aside class="hoja" id="sobre"></aside>
<script>
"use strict";
let DATOS = /*__DATOS__*/null;
const $ = (s, r = document) => r.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const svg = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ESTADO = { funciona: "Funciona", reparar: "Por reparar", mejorar: "Por mejorar", nodemostrado: "No demostrado", estructura: "Estructura", decision: "Decisión", resuelto: "Resuelto", hecho: "Hecho" };
const COLOR = { funciona: "var(--ok)", reparar: "var(--mal)", mejorar: "var(--medio)", nodemostrado: "var(--nada)", estructura: "var(--linea)", decision: "var(--nada)", resuelto: "var(--nada)", hecho: "var(--tinta2)" };
const ETQ = { VERIFICADO: "verificado", OBSERVACION: "observado", INFERIDO: "inferido", CANDIDATA: "candidato", DECISION: "decisión" };
const TIPO_EV = { prueba_real: "prueba real", prueba_simulada: "prueba simulada", observacion: "observación", declaracion: "declaración", senal_externa: "pista externa" };
const VERBO = { carga: "declara", usa_modelo: "usa el modelo de", enruta: "envía a", respalda: "tiene de respaldo a", lee: "lee", sincroniza: "se copia a", publica: "da acceso a", conecta: "está en", vigila: "vigila", ejecuta: "ejecuta", alimenta: "alimenta", lanza: "lanza", pertenece: "es parte de", aloja: "aloja", candidata_para: "es opción para", entra_por: "entra por" };
const GLIFO = { funciona: "M-4.2 .3 L-1.3 3.2 L4.4 -3.2", reparar: "M-3.4 -3.4 L3.4 3.4 M3.4 -3.4 L-3.4 3.4", mejorar: "M0 -4.4 L0 1 M0 3.6 L0 3.7" };
const icono = (e) => `<svg class="ico" viewBox="-8 -8 16 16"><circle r="6.5" fill="${["funciona", "reparar", "mejorar"].includes(e) ? COLOR[e] : "none"}" stroke="${COLOR[e] || "var(--nada)"}" stroke-width="1.6" ${GLIFO[e] ? "" : 'stroke-dasharray="2.5 2"'}/>${GLIFO[e] ? `<path d="${GLIFO[e]}" stroke="#111" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ""}</svg>`;

// ---------- fechas
const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const aFecha = (s) => new Date(s.length === 10 ? s + "T12:00:00Z" : s);
const fechaTexto = (s) => { const d = aFecha(s); return `${d.getUTCDate()} ${MES[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
function hace(s) { const m = (Date.now() - aFecha(s).getTime()) / 60000; if (m < 0) return "ahora"; if (m < 90) return `hace ${Math.max(1, Math.round(m))} min`; if (m < 2880) return `hace ${Math.round(m / 60)} h`; return `hace ${Math.round(m / 1440)} días`; }
const dias = (s) => (Date.now() - aFecha(s).getTime()) / 86400000;

// ---------- modelo
let nodos = [], aristas = [], porId = {}, vecinos = {};
const cam = { yaw: 0.62, pitch: 0.62, zoom: 1, px: 0, py: 0 };  // arranque: solo la figura, vista alta
// Por defecto el mapa es ligero: solo las piezas y las relaciones ya comprobadas. Lo demás se enciende con los filtros.
const ver = { planos: { proposiciones: false, hechos: false }, nombres: false, estados: new Set(), texto: "", sector: null, sel: null,
  sinprobar: false, sectores: new Set(), rama: null, ramaDe: null };
function rama(id, sentido) {  // "abajo": lo que depende de esta pieza (sus ramas); "arriba": de qué depende (sus madres)
  const dentro = new Set([id]); let frente = [id];
  while (frente.length) { const sig = []; for (const a of aristas) { if (a.tipo !== "rel") continue;
      const [de, hacia] = sentido === "abajo" ? [a.a.id, a.b.id] : [a.b.id, a.a.id];
      if (frente.includes(de) && !dentro.has(hacia)) { dentro.add(hacia); sig.push(hacia); } } frente = sig; }
  ver.rama = dentro; ver.ramaDe = `${sentido === "abajo" ? "Ramas de" : "Madres de"} ${porId[id].nombre}`; ver.sel = null; cierra("#ficha"); avisoFiltro(); pide(true);
}
function avisoFiltro() {
  const n = ver.sectores.size + (ver.rama ? 1 : 0), b = $("#bFiltros"); b.textContent = n ? `Filtros (${n})` : "Filtros"; b.setAttribute("aria-pressed", n > 0);
  const q = $("#quitar"); q.hidden = !ver.rama; if (ver.rama) q.textContent = `${ver.ramaDe} · quitar ×`;
}
const lienzo = $("#lienzo"), gN = $("#gNodos"), gA = $("#gAristas"), gP = $("#gPlanos");
let anillos = [], rotulos = [], RADIO = 500;

function preparar(d) {
  nodos = []; aristas = []; porId = {}; vecinos = {};
  const add = (n) => { nodos.push(n); porId[n.id] = n; vecinos[n.id] = new Set(); return n; };
  for (const o of d.objetos) add({ ...o, clase: "obj", plano: "figura", rotulo: o.nombre });
  for (const r of d.relaciones) {
    const a = porId[r.de], b = porId[r.a];
    const medio = [(a.pos[0] + b.pos[0]) / 2, (a.pos[1] + b.pos[1]) / 2, (a.pos[2] + b.pos[2]) / 2];
    porId[r.id] = { ...r, clase: "rel", plano: "figura", pos: medio, rotulo: `${a.nombre} ${VERBO[r.tipo] || r.tipo} ${b.nombre}`, a: a, b: b };
    vecinos[r.id] = new Set([a.id, b.id]);
    aristas.push({ id: r.id, tipo: "rel", a, b, estado: r.estado, plano: "figura", ref: porId[r.id] });
    vecinos[a.id].add(b.id); vecinos[b.id].add(a.id);
  }
  for (const p of d.proposiciones) add({ ...p, clase: "prop", plano: "proposiciones", rotulo: p.texto });
  for (const e of d.evidencias) add({ ...e, clase: "ev", plano: "hechos", estado: "hecho", rotulo: e.resumen });
  for (const p of d.proposiciones) {
    for (const s of p.sobre) { aristas.push({ tipo: "sobre", a: porId[p.id], b: porId[s], estado: p.estado, plano: "proposiciones" }); vecinos[p.id].add(s); vecinos[s].add(p.id); if (porId[s].clase === "rel") { vecinos[p.id].add(porId[s].a.id); vecinos[p.id].add(porId[s].b.id); } }
    for (const e of p.evidencia) { aristas.push({ tipo: "apoya", a: porId[e], b: porId[p.id], estado: "hecho", plano: "hechos" }); vecinos[p.id].add(e); vecinos[e].add(p.id); }
  }
}

function dibujar(d) {
  const gR = $("#gRotulos");
  gN.textContent = gA.textContent = gP.textContent = gR.textContent = ""; anillos = []; rotulos = [];
  const R = RADIO = d.radio || 500;
  for (const [nombre, y, leyenda] of [["hechos", d.planos.hechos, "HECHOS · lo observado"], ["figura", d.planos.figura, "FIGURA · el sistema"], ["proposiciones", d.planos.proposiciones, "PROPOSICIONES · lo que se afirma"]]) {
    const pts = []; for (let i = 0; i < 56; i++) { const t = i / 56 * 2 * Math.PI; pts.push([R * Math.cos(t), y, R * Math.sin(t)]); }
    anillos.push({ nombre, pts, el: svg("polygon", { fill: "var(--tinta)", "fill-opacity": nombre === "figura" ? .035 : .02, stroke: "var(--linea)", "stroke-width": 1, "stroke-dasharray": nombre === "figura" ? "" : "3 5" }, gP),
      txt: Object.assign(svg("text", { class: "plano", "text-anchor": "start" }, gP), { textContent: leyenda }) });
  }
  for (const s of d.sectores) { const t = svg("text", { class: "sector", "text-anchor": "middle" }, gR); t.textContent = s.nombre; t.dataset.sector = s.id; rotulos.push({ el: t, pos: [(R + 30) * Math.cos(s.angulo), 0, (R + 30) * Math.sin(s.angulo)], id: s.id }); }
  for (const a of aristas) {
    const rel = a.tipo === "rel";
    a.el = svg("line", { stroke: rel ? COLOR[a.estado] : "var(--tinta3)", "stroke-width": rel ? (a.estado === "estructura" ? 1 : 1.8) : .8, "stroke-linecap": "round",
      "stroke-dasharray": rel ? (a.estado === "nodemostrado" ? "2 5" : a.estado === "estructura" ? "1 4" : "") : "1 3", opacity: rel ? (a.estado === "nodemostrado" ? .5 : .85) : .28 }, gA);
  }
  for (const n of nodos) {
    const g = n.el = svg("g", {}, gN), c = COLOR[n.estado], lleno = ["funciona", "reparar", "mejorar"].includes(n.estado);
    const viejo = n.ultima_prueba && dias(n.ultima_prueba) > 7 && n.estado === "funciona";
    if (n.clase === "obj") {
      // Tamaño = cuánto cuelga de la pieza. Doble aro = nodo de origen. Cuadro punteado con + = aún por construir.
      const r = n.r = 9 + Math.min(8, (n.ramas || 0) * .8);
      if (n.pos[1] > 0) n.tallo = svg("line", { stroke: "var(--tinta3)", "stroke-width": 1, opacity: .45 }, gA);
      if (n.por_construir) { svg("rect", { x: -10, y: -10, width: 20, height: 20, rx: 4, class: "ne", fill: "var(--sup)", stroke: c, "stroke-width": 1.8, "stroke-dasharray": "2 3" }, g);
        svg("path", { d: "M-4.5 0 L4.5 0 M0 -4.5 L0 4.5", class: "ne", stroke: c, "stroke-width": 1.8, fill: "none" }, g); }
      else svg("circle", { r, class: "ne", fill: lleno ? c : "var(--sup)", stroke: c, "stroke-width": 2, "stroke-dasharray": lleno ? "" : "3 3", opacity: viejo ? .55 : 1 }, g);
      if (n.origen) svg("circle", { r: r + 4.5, class: "ne", fill: "none", stroke: "var(--tinta)", "stroke-width": 1.4 }, g);
      if (n.estabilidad === "inestable") svg("circle", { r: r + 8, class: "ne", fill: "none", stroke: "var(--medio)", "stroke-width": 1.6, "stroke-dasharray": "1 3" }, g);
    } else if (n.clase === "prop") {
      const dash = n.etiqueta === "INFERIDO" ? "2 2.5" : n.estado === "nodemostrado" || n.estado === "resuelto" ? "3 3" : "";
      svg("path", { d: "M0 -10 L10 0 L0 10 L-10 0 Z", class: "ne", fill: lleno ? c : "var(--sup)", stroke: c, "stroke-width": 2, "stroke-dasharray": dash }, g);
      if (n.etiqueta === "CANDIDATA") svg("path", { d: "M0 -14 L14 0 L0 14 L-14 0 Z", class: "ne", fill: "none", stroke: c, "stroke-width": 1, "stroke-dasharray": "3 3" }, g);
    } else {
      const fuerte = n.tipo === "prueba_real" || n.tipo === "observacion";
      svg("rect", { x: -7, y: -7, width: 14, height: 14, rx: 2, class: "ne", fill: n.tipo === "prueba_real" ? "var(--tinta)" : fuerte ? "var(--tinta3)" : "var(--sup)", stroke: "var(--tinta2)", "stroke-width": 1.5, "stroke-dasharray": fuerte ? "" : "2 2" }, g);
    }
    if (GLIFO[n.estado] && n.clase !== "ev" && !n.por_construir) svg("path", { d: GLIFO[n.estado], class: "ne", fill: "none", stroke: "#111", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
    n.anillo = svg("circle", { r: 17, class: "ne", fill: "none", stroke: "var(--foco)", "stroke-width": 2.5, visibility: "hidden" }, g);
    if (n.clase === "obj") { n.txt = svg("text", { x: 15, y: 4 }, g); n.txt.textContent = n.nombre; }
  }
}

// ---------- proyección
let W = 0, H = 0, sucio = false, ordenar = true;
function proyecta(p) {
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const x1 = p[0] * cy + p[2] * sy, z1 = -p[0] * sy + p[2] * cy;
  const y1 = p[1] * cp + z1 * sp, z2 = -p[1] * sp + z1 * cp;  // se mira desde arriba
  const f = 5200 / (5200 + z2);                                // perspectiva suave: casi ortográfica
  return [W / 2 + cam.px + x1 * f * cam.zoom, H / 2 + cam.py - y1 * f * cam.zoom, z2, f * cam.zoom];
}
function visible(n) {
  if (n.plano !== "figura" && !ver.planos[n.plano]) return false;
  if (n.clase === "obj") {
    if (ver.rama && !ver.rama.has(n.id)) return false;
    if (ver.sectores.size && !ver.sectores.has(n.sector)) return false;
  } else if (ver.rama || ver.sectores.size) {  // proposiciones y hechos: solo los de piezas visibles
    const piezas = n.clase === "prop" ? n.sobre : n.apoya.flatMap((p) => porId[p].sobre);
    if (!piezas.some((s) => { const o = porId[s]; return o.clase === "rel" ? visible(o.a) || visible(o.b) : visible(o); })) return false;
  }
  return true;
}
function apagado(n) {
  if (ver.sel) return !(n.id === ver.sel || vecinos[ver.sel]?.has(n.id));
  if (ver.estados.size && !ver.estados.has(n.estado)) return true;
  if (ver.sector && n.clase === "obj" && n.sector !== ver.sector) return true;
  if (ver.texto && !(n.rotulo || "").toLowerCase().includes(ver.texto) && !(n.id || "").includes(ver.texto)) return true;
  return false;
}
function pinta() {
  sucio = false;
  for (const n of nodos) {
    const v = visible(n); n.el.style.display = v ? "" : "none"; if (!v) { if (n.tallo) n.tallo.style.display = "none"; continue; }
    const s = n.s = proyecta(n.pos), k = Math.max(.42, Math.min(2.6, s[3] * 1.15));
    n.el.setAttribute("transform", `translate(${s[0].toFixed(1)} ${s[1].toFixed(1)}) scale(${k.toFixed(3)})`);
    const off = apagado(n); n.el.style.opacity = off ? .13 : 1;
    n.anillo.setAttribute("visibility", n.id === ver.sel ? "visible" : "hidden");
    if (n.tallo) { const pie = proyecta([n.pos[0], 0, n.pos[2]]); n.tallo.style.display = v ? "" : "none"; n.tallo.style.opacity = off ? .06 : .45;

  <p>${["¿Está todo bien?", "¿Qué falta?", "¿Qué reparo primero?", "¿Qué no está demostrado?"].map((q) => `<button class="btn" data-q="${q}" style="margin:2px">${q}</button>`).join("")}</p>
  <form id="fChat" style="display:flex;gap:6px"><input id="q" placeholder="Escribe tu pregunta" autocomplete="off" style="flex:1;padding:9px;border-radius:10px;border:1px solid var(--linea);background:var(--sup);color:var(--tinta);font:inherit"><button class="btn">Enviar</button></form>`;
  const hilo = $("#hilo"), pinta = () => { hilo.innerHTML = charla.map((t) => `<div class="tarjeta ${t.role === "user" ? "" : "e-decision"}"><b>${t.role === "user" ? "Tú" : "Mapa"}</b><p style="white-space:pre-wrap">${esc(t.content)}</p>${t.modelo ? `<p class="chico suave">${esc(t.modelo)}</p>` : ""}</div>`).join(""); l.scrollTop = l.scrollHeight; };
  const envia = async (q) => { if (!q) return; charla.push({ role: "user", content: q }); charla.push({ role: "assistant", content: "Pensando…" }); pinta();
    try { const r = await fetch("chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mensajes: charla.slice(0, -1).map(({ role, content }) => ({ role, content })) }) });
      const j = await r.json(); charla[charla.length - 1] = { role: "assistant", content: j.respuesta || j.error || "Sin respuesta.", modelo: j.modelo };
    } catch (_) { charla[charla.length - 1] = { role: "assistant", content: "No hay conexión con la PC: la conversación solo funciona con la PC encendida y dentro de tu red privada." }; }
    pinta(); };
  l.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => envia(b.dataset.q));
  $("#fChat").onsubmit = (e) => { e.preventDefault(); const v = $("#q").value.trim(); $("#q").value = ""; envia(v); };
  pinta(); l.classList.add("abierta"); cierra("#ficha"); cierra("#sobre");
}

// ---------- arranque
function arranca(d) {
  DATOS = d; preparar(d); dibujar(d); cabecera(d); W = lienzo.clientWidth; H = lienzo.clientHeight; encuadre(); pide(true);
  // Pantalla apaisada y baja (celular girado): los tres planos apilados no caben; se empieza desde arriba.
  if (W > H * 1.25 && H < 560) vista("planta", true);
  $("#carga").style.display = "none"; setInterval(() => cabecera(DATOS), 60000);
  window.MAPA = { datos: d, elige, vista, cam, nodos: () => nodos.length };
  const m = location.hash.match(/nodo=([\w.-]+)/); if (m && porId[m[1]]) elige(m[1], true);
}
const b64 = (t) => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
async function descifra(claveTexto) {
  const sobreCifrado = await (await fetch("mapa.cifrado.json?t=" + Date.now(), { cache: "no-store" })).json();
  const clave = await crypto.subtle.importKey("raw", b64(claveTexto), "AES-GCM", false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(sobreCifrado.iv) }, clave, b64(sobreCifrado.datos));
  return JSON.parse(new TextDecoder().decode(claro));
}
async function abrir(claveTexto) {
  try { const d = await descifra(claveTexto); try { localStorage.setItem("mapa.k", claveTexto); } catch (_) {} arranca(d); return true; }
  catch (err) { $("#cargaTexto").textContent = "No se pudo abrir el mapa: la clave no corresponde o no hay conexión."; $("#claveForm").hidden = false; return false; }
}
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("sw.js").catch(() => {});
(async function () {
  if (DATOS) return arranca(DATOS);
  const enlace = (location.hash.match(/k=([A-Za-z0-9_-]{43})/) || [])[1];
  if (enlace) history.replaceState(null, "", location.pathname + location.search);
  let guardada = null; try { guardada = localStorage.getItem("mapa.k"); } catch (_) {}
  $("#claveForm").onsubmit = (e) => { e.preventDefault(); const v = ($("#claveCampo").value.match(/[A-Za-z0-9_-]{43}/) || [])[0]; if (v) abrir(v); };
  if (enlace || guardada) await abrir(enlace || guardada); else { $("#cargaTexto").textContent = "Mapa del sistema de agentes"; $("#claveForm").hidden = false; }
  setInterval(async () => { const k = (() => { try { return localStorage.getItem("mapa.k"); } catch (_) { return null; } })(); if (!k || !DATOS || document.hidden) return; try { const d = await descifra(k); if (d.datos_al !== DATOS.datos_al) { const sel = ver.sel; arranca(d); if (sel && porId[sel]) elige(sel); } } catch (_) {} }, 5 * 60000);
})();
